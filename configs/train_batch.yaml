# =============================================================================
# CDW-Seg  —  COCO training configuration
# =============================================================================
# Single source of truth: edit `classes` here only.
# num_classes in model.args is set automatically by train.py.
# =============================================================================
# -----------------------------------------------------------------------------
# Class definitions  (order = contiguous index; index 0 = background)
# -----------------------------------------------------------------------------
classes:
  - background            # 0  — always first; ignored in loss when ignore_bg: true
  # - bin                   # 1
  # - concrete_bricks_tiles # 2
  # - soils                 # 3
  - green_waste_timber    # 4
  # - plastic               # 5  
  # - metals_e_waste        # 6
  # - non_recyclable_waste  # 7
  # - cardboard             # 8
  # - plaster_board         # 9
  # Uncomment when fine-tune labelled data is available:
  # - paint_can           # 10  
  # - needles_syringes    # 11
  # - dead_animal         # 12
# Keep false for no-bag training: background must stay in the loss so the
# model learns to predict nothing on empty / no-bag images.
ignore_bg: false
# -----------------------------------------------------------------------------
# Step 1 — Dataset preparation
#   1) Merge no-bag folder into COCO metadata:
#        python scripts/add_nobag_to_coco.py \
#          --ann data/annotations.json \
#          --nobag-dir <NOBAG_DIR> \
#          --images-dir data/train \
#          --out-ann data/annotations_with_nobag.json
#   2) Prepare splits:
#        python finetune.py --config configs/train_batch.yaml --prepare-only --force-prepare
# -----------------------------------------------------------------------------
split_preparation:
  source_dir:    data
  coco_root:     cdw_coco   # splits will be written here
  source_images_subdir:  train
  source_ann_file:  data/annotations_with_nobag.json
  train_ratio: 0.70
  val_ratio:   0.20
  test_ratio:  0.10
  split_seed:  42
# -----------------------------------------------------------------------------
# COCO dataset root  (produced by Step 1)
# -----------------------------------------------------------------------------
coco:
  coco_root: cdw_coco
# -----------------------------------------------------------------------------
# Input / augmentation
# -----------------------------------------------------------------------------
inp_size:   512
augment:    true   # applied to train split only
# -----------------------------------------------------------------------------
# DataLoader
# -----------------------------------------------------------------------------
batch_size:  2
num_workers: 2     # set 0 on Windows
# Gradient accumulation  (effective batch = batch_size × accum_steps)
accum_steps: 2
grad_checkpoint: true

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
sam_checkpoint: pretrained/sam2.1_hiera_large.pt
model:
  name: sam
  args:
    # num_classes is injected automatically from annotation JSON — do not set manually
    inp_size: 512
    loss: iou
    encoder_mode:
      name: sam
      stages: [2, 6, 36, 4]
      global_att_blocks: [23, 33, 43]
      window_pos_embed_bkg_spatial_size: [7, 7]
      window_spec: [8, 4, 16, 8]
      num_pos_feats: 256
      normalize: true
      scale: null
      temperature: 10000
      d_model: 256
      backbone_channel_list: [1152, 576, 288, 144]
      fpn_top_down_levels: [2, 3]
      fpn_interp_model: nearest
      img_size: 256
      mlp_ratio: 4
      patch_size: 16
      qkv_bias: true
      use_rel_pos: true
      window_size: 14
      out_chans: 256
      scale_factor: 32
      input_type: fft
      freq_nums: 0.25
      prompt_type: highpass
      prompt_embed_dim: 256
      tuning_stage: 1234
      handcrafted_tune: true
      embedding_tune: true
      adaptor: adaptor
      embed_dim: 144
      depth: 32
      num_heads: 2
      global_attn_indexes: [7, 15, 23, 31]
# -----------------------------------------------------------------------------
# Optimisation  (lower LR suited to finetune from an existing best ckpt)
# -----------------------------------------------------------------------------
optimizer:
  name: adamw
  args:
    lr: 0.00005
    weight_decay: 0.05
lr_scheduler:
  name: cosine
  warmup_epochs: 3
  warmup_lr: 1.0e-6
lr_min: 1.0e-6
freeze_encoder: true
use_amp: true
# -----------------------------------------------------------------------------
# Training loop
# -----------------------------------------------------------------------------
epoch_max:  100
epoch_val:  1
epoch_save: 20
early_stopping:
  patience:  15
  min_delta: 0.003
# Finetune from your val_mIoU=0.86 checkpoint (uncomment + set path):
# resume:      save/<your_run>/model_epoch_best.pth
# start_epoch: 1
# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
eval_type: seg
# Image-level FP on no-bag samples (GT has no foreground).
# Counts as FP when predicted foreground area / image area > area_thresh.
no_bag_fp:
  area_thresh: 0.001   # 0.1% of image
data_norm:
  inp:
    sub: [0.5]
    div: [0.5]
  gt:
    sub: [0.5]
    div: [0.5]